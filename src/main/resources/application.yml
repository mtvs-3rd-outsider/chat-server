spring:
  application:
    name: chat-server
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URI:http://config-server.ugot.svc.cluster.local}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,startup"
  endpoint:
    startup:
      enabled: true

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.security: DEBUG
    io.rsocket: DEBUG

# Server configuration is handled by profiles in backend/config/chat-server/
